# 이 프로젝트 전용 인프라. 공유 nst-nexus SeaweedFS는 볼륨 슬롯이 꽉 차(8/8) 새 쓰기를 받지 못해 원본 보관소를 따로 둔다.
# 실행은 저장소 루트에서: docker compose --env-file .env -f infra/docker-compose.yml …  (scripts/airflow.sh)
# 주의: 프로젝트 전체 `down` 금지 — storage·neo4j까지 내려간다. Airflow만 내릴 때는 scripts/airflow.sh down.
name: nst-regulation

# Airflow 3 공통 (spec §2.1): LocalExecutor, 메타 DB는 공유 PG의 reg_airflow, REG_*는 .env + 컨테이너 안 주소로 덮어씀
x-airflow-common: &airflow-common
  image: nst-regulation/airflow:3.3.2
  build:
    context: ..
    dockerfile: infra/airflow/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    TZ: Asia/Seoul
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${REG_AIRFLOW_FERNET_KEY:?set REG_AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${REG_AIRFLOW_SECRET_KEY:?set REG_AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${REG_AIRFLOW_JWT_SECRET:?set REG_AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://reg_airflow:${REG_AIRFLOW_DB_PASSWORD:?set REG_AIRFLOW_DB_PASSWORD}@postgres:5432/reg_airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
    REG_DATABASE_URL: ${REG_DATABASE_URL_DOCKER:?set REG_DATABASE_URL_DOCKER}
    REG_S3_ENDPOINT: http://storage:8333
    REG_OS_URL: ${REG_OS_URL_DOCKER:?set REG_OS_URL_DOCKER}
    REG_NEO4J_URL: bolt://neo4j:7687
    REG_SMTP_HOST: mailpit
    REG_SMTP_PORT: "1025"
    REG_CONVERTER_URL: http://converter:8080
    REG_AIRFLOW_LOG_DIR: /opt/airflow/logs
  volumes:
    - ../airflow/dags:/opt/airflow/dags:ro
    - ../config:/opt/nst-regulation/config:ro
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  networks: [default, nais, convert]
  restart: unless-stopped

services:
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -volume.max=0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports: ["127.0.0.1:21066:8333"]
    volumes:
      - storage-data:/data
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped
  # 공유 nst-nexus OpenSearch(내부 전용)를 이 서버의 프로세스에서 쓰기 위한 중계: 127.0.0.1:21067 → opensearch:9200
  opensearch-proxy:
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:9200,fork,reuseaddr TCP:opensearch:9200
    ports: ["127.0.0.1:21067:9200"]
    networks: [default, nais]
    restart: unless-stopped
  # 개정 영향 탐색용 그래프 (PostgreSQL에서 파생, 언제든 재투영 가능)
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${REG_NEO4J_PASSWORD:?set REG_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 2G
    ports: ["0.0.0.0:21064:7687", "0.0.0.0:21065:7474"]  # 내부망 공개 (비밀번호 보호)
    volumes:
      - neo4j-data:/data
    restart: unless-stopped
  # 공유 nst-nexus Mailpit(개발용 SMTP)으로의 중계: 127.0.0.1:21068 → mailpit:1025
  mailpit-proxy:
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:1025,fork,reuseaddr TCP:mailpit:1025
    ports: ["127.0.0.1:21068:1025"]
    networks: [default, nais]
    restart: unless-stopped
  # HWP→PDF 보기용 변환기 (spec D-2 B안): 내부 네트워크 convert에만, 한 번에 하나씩 변환
  converter:
    image: nst-regulation/converter:0.2
    build: ./converter
    entrypoint: ["python3", "/srv/converter/server.py"]
    user: "65534:65534"
    environment:
      HOME: /tmp
    networks: [convert]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "/opt/nst-regulation/infra/airflow/init.sh"]
    restart: "no"
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["21062:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      converter:
        condition: service_started
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  # OpenSearch Dashboards: 공유 클러스터의 보안 플러그인 계정으로 로그인 (2026-10-02, 사용자 결정 A안)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      OPENSEARCH_USERNAME: kibanaserver
      OPENSEARCH_PASSWORD: ${REG_OS_DASHBOARDS_PASSWORD:?set REG_OS_DASHBOARDS_PASSWORD}
      OPENSEARCH_SECURITY_COOKIE_SECURE: "false"   # HTTP(내부망)로 접속
    ports: ["0.0.0.0:21069:5601"]
    networks: [default, nais]
    restart: unless-stopped
volumes:
  storage-data:
  neo4j-data:
  airflow-logs:
networks:
  nais:
    name: nais_default
    external: true
  # 변환기 전용: 외부(인터넷·LAN)로 나가지 않는다 — 기존 docker run --network none과 같은 격리
  convert:
    internal: true
