# MinerU 4 (문서 OCR·레이아웃·표 추출) — Windows WSL2 + RTX 4090, vllm-local과 같은 PC
#   vlm : MinerU VLM 추론 서버 (OpenAI 호환)      -> 컨테이너 내부 :30000 (외부 미공개)
#   api : MinerU V1 파싱 API (업로드→작업→결과)   -> :8004  (/v1/health, /v1/uploads, /v1/parse/jobs)
# VRAM 예산(24GB): vllm-local embed 0.10 + rerank 0.10 + llm 0.40 + 여기 vlm 0.20 = 0.80, 나머지 api 소형 모델·화면
#   → vllm-local의 llm을 0.60 → 0.40, max-model-len 32768 → 16384 로 함께 낮춘다 (infra/vllm-local 참고)
# 시작 순서: vllm-local 세 서비스가 healthy 된 뒤 이 compose를 올린다 (vLLM이 기동 시 남은 VRAM을 본다)
# 방화벽: 플랫폼 서버(192.168.0.3)만 8004 허용
#   New-NetFirewallRule -DisplayName "MinerU (nst server only)" -Direction Inbound -Protocol TCP -LocalPort 8004 -RemoteAddress 192.168.0.3 -Action Allow
# 이미지: MinerU 저장소의 docker/global/Dockerfile 로 빌드 (bash build.sh)

x-mineru: &mineru
  image: mineru:4
  ipc: host
  ulimits: { memlock: -1, stack: 67108864 }
  environment:
    MINERU_MODEL_SOURCE: local
  entrypoint: ["mineru-kit"]
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  restart: unless-stopped

services:
  vlm:
    <<: *mineru
    command: ["vlm-server", "--host", "0.0.0.0", "--port", "30000", "--gpu-memory-utilization", "0.20"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 80

  api:
    <<: *mineru
    ports: ["8004:8000"]
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000", "--tier", "standard",
              "--vlm-server-url", "http://vlm:30000", "--concurrency", "1",
              "--api-key", "${MINERU_API_KEY:?MINERU_API_KEY를 .env에 넣으세요}"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 80
    depends_on:
      vlm: { condition: service_healthy }
