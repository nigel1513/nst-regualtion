  expect: {status: answered, institution: ETRI, work_contains: ETRI/출장요령, article: a11, verdict: null}
- id: kist-hotel-late
  question: KIST 출장 중 숙박비 상한을 넘겨 썼는데 여행 끝나고 10일 지났어요. 정산 신청 가능한가요?
  expect: {status: answered, institution: KIST, work_contains: KIST/여비규정, article: a14, verdict: 미충족}
