  question: 천문연 국외출장 결과보고서는 언제까지 내야 해?
  expect: {status: answered, institution: KASI, work_contains: 국외출장, article: a8, verdict: null}
- id: no-inst-1
  question: 출장 다녀온 지 10일 지났는데 증빙을 안 냈어요. 괜찮나요?
  expect: {status: need_institution}
- id: no-inst-2
  question: 연차휴가 사용 촉구를 받으면 며칠 안에 사용 시기를 정해야 하나요?
  expect: {status: need_institution}
- id: none-1
  question: 천문연 직원이 반려동물을 데리고 출근해도 되나요?
  expect: {status: [not_found, answered], institution: KASI, verdict: 판단불가}
- id: none-2
  question: 연구회 사무실 커피머신 사용 규칙이 있나요?
  # 규칙이 있는지 묻는 일반 질문 (자기 상황 판정이 아니다): 결론 없이 '규정에 없다'고 답하거나 찾지 못함
  expect: {status: [not_found, answered], institution: NST, verdict: null}
