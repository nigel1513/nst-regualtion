- id: kasi-colloquium-chair
  question: 천문연 콜로키움 위원회 위원장은 누가 임명해?
  expect: {status: answered, institution: KASI, work_contains: KASI/KASI콜로키움운영기준, article: a4, verdict: null}
- id: kasi-yeobi-deadline-fact
  question: 천문연 출장 증빙은 언제까지 내야 해?
  expect: {status: answered, institution: KASI, work_contains: KASI/여비규정, article: a27, verdict: null}
