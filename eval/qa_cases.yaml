# 질의응답 평가 문항 (spec 12). 정답 조문은 2026-10-02 적재 실데이터의 현행 버전에서 확인함.
# expect.status 가 목록이면 그중 하나면 정답 (관련 규정 없음 → 찾지 못함 또는 판단불가 답변)
# expect.article = 근거 1~2위에 있어야 하는 조, expect.work_contains = 그 규범문서 id에 포함될 문자열
# expect.verdict: null = 일반 답변 문항 (규정 내용을 묻는 질문: 결론 없이 바로 답해야 한다, 2026-10-04 assistant-scope)
- id: kasi-yeobi-late
  question: 천문연 소속인데 출장 다녀온 지 10일 지났고 지출결의를 아직 안 했어요. 문제가 없을까요?
  expect: {status: answered, institution: KASI, work_contains: KASI/여비규정, article: a27, verdict: 미충족}
- id: kasi-yeobi-ok
  question: 한국천문연구원 직원입니다. 출장 끝나고 5일 지났는데 아직 증빙서를 안 냈어요.
  expect: {status: answered, institution: KASI, work_contains: KASI/여비규정, article: a27, verdict: 충족}
