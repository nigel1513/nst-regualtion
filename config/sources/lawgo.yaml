# law.go.kr 법령 미러 설정 (sources/lawgo, spec §3A). 바꾸면 다음 배치부터 반영된다.
promote:              # 인용 여부와 상관없이 regulation.work로 승격 (검색·질의응답·개정 알림 대상)
  laws:
    - 국가연구개발혁신법
    - 국가연구개발혁신법 시행령
    - 국가연구개발혁신법 시행규칙
    - 과학기술분야 정부출연연구기관 등의 설립·운영 및 육성에 관한 법률
    - 과학기술분야 정부출연연구기관 등의 설립·운영 및 육성에 관한 법률 시행령
    - 공공기관의 운영에 관한 법률
    - 공공기관의 운영에 관한 법률 시행령
    - 국가를 당사자로 하는 계약에 관한 법률
    - 국가를 당사자로 하는 계약에 관한 법률 시행령
    - 공무원 여비 규정
  admruls: []
law:                  # 미러할 법령 범위 (사용자 결정 2026-10-03: 현행만, 필요한 법령만). 확인: reg law targets
  include:            # (a) NST·출연연 운영에 필요한 법령 시드 (인용 여부와 상관없이 미러)
    - 과학기술분야 정부출연연구기관 등의 설립·운영 및 육성에 관한 법률
    - 국가연구개발혁신법
    - 공공기관의 운영에 관한 법률
    - 국가를 당사자로 하는 계약에 관한 법률
    - 공무원 여비 규정
    - 개인정보 보호법
    - 공공기록물 관리에 관한 법률
    - 공공기관의 정보공개에 관한 법률
    - 부정청탁 및 금품등 수수의 금지에 관한 법률
    - 공직자윤리법
    - 근로기준법
    - 연구실 안전환경 조성에 관한 법률
    - 산업안전보건법
    - 보안업무규정
    - 국가재정법
  cited:              # (b) 내부규정이 인용한 이름 중 법령형인 것 (regulation.reference, 내부 work로 풀린 인용 제외)
    suffixes: [법, 법률, 시행령, 시행규칙, 영, 에 관한 규정]   # 이 말로 끝나는 이름만 (띄어쓰기·가운뎃점 무시)
    exclude: [법, 법률, 시행령, 시행규칙, 영, 동법, 동 법, 같은 법, 이 법, 본법, 동법 시행령, 같은 법 시행령,
              동법 시행규칙, 같은 법 시행규칙, 동 시행령, 같은 영, 이 영, 동령]   # 앞 문장을 가리키는 일반 이름
    exclude_suffixes: [방법]   # 법령이 아닌 낱말 (개폐방법, 결정방법 …)
    min_citations: 1
  children: [시행령, 시행규칙]   # (c) 위 법령마다 함께 받는 하위 법령 (정식 이름 + 공백 + 이 말)
  max_targets: 4000   # 대상 이름 상한 (설정 → 인용 많은 순, 자식은 부모 바로 뒤). 넘친 것은 reg law targets가 보고한다
admrul:               # 내부규정 인용 외에 미러에 저장할 행정규칙 (정식 이름; 카탈로그와 띄어쓰기·가운뎃점 무시하고 맞춘다)
  include:
    - 국가연구개발사업 연구개발비 사용 기준
annex:
  store_pdf: true             # DRF 별표 HTML은 껍데기라 목록의 PDF도 저장 (판정 R5)
  body_limit_per_run: 2000    # 실행당 별표 본문 수 (판정 R6)
sync:
  buffer_days: 7              # 마지막 성공일보다 이만큼 이전 공포일이 나오면 목록 넘김을 멈춘다
  page_size: 100              # DRF display 최대값
  abolish_min_ratio: 0.95     # 전체 목록이 기존 현행의 이 비율 미만이면 폐지 처리 없이 실패 (판정 R8)
