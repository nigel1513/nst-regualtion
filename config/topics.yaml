# 기관 비교용 주제와 비교 항목 (서비스 UI 개편 spec §4).
#
# topics: 규정 ↔ 주제 분류 (reg topics classify).
#   keywords — 규정 제목에 들어 있으면 그 주제로 본다. 겹치면 긴 낱말이 먼저 자리를 차지하고(연수직 > 연수),
#              제목 끝에 가까운 낱말(한국어 복합 제목의 머리말)이 첫째 주제가 된다. 규정당 최대 2개.
#   description — 제목 규칙이 맞지 않을 때 bge-m3 임베딩 유사도로 비교하는 설명문.
# items: 주제별 비교 항목 (reg compare build).
#   query — 기관별 하이브리드 검색어. ask — EXAONE에게 묻는 질문. unit — 화면 단위 표시.
#   norm — 값 정규화 규칙: duration(기간·기한 → "7일"/"1개월"/"5년"), won(금액 → 원 단위 정수),
#          boolean(있음/없음), text(공백 정리한 짧은 글).
#   min/max — (won) 그럴듯한 금액 범위. 밖이면 표에서 다른 칸(식비·운임)을 읽은 것으로 보고 다시 묻는다.
# id는 API·DB 키라 바꾸지 않는다. 라벨·설명·검색어·키워드는 고쳐도 된다 (다시 분류·추출하면 반영).

