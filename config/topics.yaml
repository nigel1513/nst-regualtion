items:
  travel:
    - id: evidence_deadline
      label: 출장 증빙 제출 기한
      query: 출장 종료 후 출장 증빙서 제출 기한 며칠 이내
      ask: 국내 출장을 마친 뒤 출장 증빙서류나 출장복명서를 며칠 이내에 제출해야 하는가? (국외 출장 기한이 따로 있으면 국내 기준)
      unit: 일
      norm: duration
    - id: settlement_deadline
      label: 여비 정산 기한
      query: 출장 여비 정산 신청 기한 출장 종료 후 이내 정산
      ask: 국내 출장 여비는 출장이 끝난(귀임한) 뒤 며칠 이내에 정산해야 하는가? (국외 출장 기한이 따로 있으면 국내 기준)
      unit: 일
      norm: duration
    - id: per_diem
      label: 일비
      query: 국내 출장 일비 1일 정액 지급액 원
      ask: 국내 출장의 일비(1일당 정액)는 얼마인가? 근무지 내 출장 여비나 식비가 아니라 일비를 찾는다. 직급별로 다르면 일반 직원(임원이 아닌 직원) 기준.
      unit: 원
      norm: won
      min: 10000
      max: 100000
    - id: lodging_cap
      label: 국내 숙박비 상한
      query: 국내 출장 숙박비 상한액 1박 실비 한도 원
      ask: 국내 출장 숙박비의 1박 상한액은 얼마인가? 지역·직급별로 다르면 일반 직원의 서울특별시 기준.
      unit: 원
      norm: won
      min: 30000
      max: 500000
    - id: overseas_review
      label: 국외출장 사전 심의
      query: 국외출장 사전 심의 위원회 심사 승인 계획서
      ask: 국외출장(해외출장)을 가기 전에 위원회 심의나 사전 심사를 받아야 하는가? 그런 심의·심사 절차를 정한 조문이 있으면 '있음'.
      unit: ""
      norm: boolean
  accounting:
    - id: fiscal_year
      label: 회계연도
      query: 회계연도는 매년 1월 1일에 시작하여 12월 31일에 종료
      ask: 회계연도는 언제 시작해서 언제 끝나는가?
      unit: ""
      norm: text
    - id: budget_carryover
      label: 예산 이월
      query: 예산 이월 사용 다음 회계연도 이월 승인
      ask: 다 쓰지 못한 예산을 다음 회계연도로 이월해 쓸 수 있는가? (있으면 '있음', 없으면 '없음')
      unit: ""
      norm: boolean
    - id: expense_deadline
      label: 지출 결의 기한
      query: 지출결의 기한 지출원인행위 후 이내 지출 결의서
      ask: 지출 결의(지출원인행위 후 지출 처리)는 며칠 이내에 해야 하는가?
      unit: 일
      norm: duration
    - id: settlement_report
      label: 결산 보고 기한
      query: 결산서 작성 제출 보고 기한 회계연도 종료 후 이사회
      ask: 결산 보고서는 회계연도가 끝난 뒤 언제까지 제출(보고)해야 하는가?
      unit: ""
      norm: text
  contract:
    - id: private_contract_goods
      label: 수의계약 한도(물품)
      query: 수의계약 추정가격 물품 제조 구매 원 이하 수의계약 할 수 있다
      ask: 물품 구매(제조)에서 수의계약을 할 수 있는 추정가격 한도는 얼마인가?
      unit: 원
      norm: won
    - id: private_contract_services
      label: 수의계약 한도(용역)
      query: 수의계약 추정가격 용역 원 이하 수의계약
      ask: 용역 계약에서 수의계약을 할 수 있는 추정가격 한도는 얼마인가?
      unit: 원
      norm: won
    - id: contract_review_threshold
      label: 계약 심의 기준액
      query: 계약심의위원회 심의 대상 계약 금액 이상
      ask: 계약심의위원회 심의를 받아야 하는 계약 금액 기준은 얼마 이상인가?
      unit: 원
      norm: won
    - id: inspection_deadline
      label: 검수 기한
      query: 검수 납품 완료 통지 받은 날부터 이내 검사 완료
      ask: 납품(이행 완료) 통지를 받은 뒤 검사·검수를 며칠 이내에 마쳐야 하는가?
      unit: 일
      norm: duration
  hr:
    - id: probation_period
      label: 수습 기간
      query: 신규 채용 수습 기간 수습 임용 개월
      ask: 신규 채용 직원의 수습 기간은 얼마인가?
      unit: 개월
      norm: duration
  service:
    - id: flexible_work_application
      label: 유연근무 신청
      query: 유연근무 신청 절차 신청서 제출 승인 사전 신청
      ask: 유연근무를 하려면 언제까지 또는 어떻게 신청해야 하는가? (짧게)
      unit: ""
      norm: text
    - id: leave_carryover
      label: 연차 이월
      query: 연차휴가 이월 사용 연차 저축 다음 해 이월
      ask: 쓰지 않은 연차휴가를 다음 해로 이월(저축)할 수 있는가? (있으면 '있음', 없으면 '없음')
      unit: ""
      norm: boolean
  research:
    - id: equipment_review_threshold
      label: 연구장비 도입 심의 기준액
      query: 연구장비 도입 심의 장비심의위원회 원 이상 장비
      ask: 연구장비를 도입할 때 심의(장비심의위원회 등)를 받아야 하는 금액 기준은 얼마 이상인가?
      unit: 원
      norm: won
    - id: research_note_retention
      label: 연구노트 보존 기간
      query: 연구노트 보존 기간 년 보관 연구 종료 후
      ask: 연구노트는 몇 년간 보존해야 하는가?
      unit: 년
      norm: duration
    - id: research_fund_settlement
      label: 연구비 정산 기한
      query: 연구비 정산 기한 연구 종료 후 이내 정산 보고
      ask: 연구과제가 끝난 뒤 연구비 정산은 언제까지 해야 하는가?
      unit: ""
      norm: duration
  security:
    - id: security_pledge
      label: 보안 서약
      query: 보안서약서 제출 임용 퇴직 시 보안 서약
      ask: 직원이 보안 서약서를 제출해야 한다는 규정이 있는가? (있으면 '있음', 없으면 '없음')
      unit: ""
      norm: boolean
    - id: external_transfer_approval
      label: 외부 반출 승인
      query: 자료 외부 반출 승인 보안담당관 반출 시 승인
      ask: 보안 자료나 저장매체를 외부로 반출할 때 누구의 승인을 받아야 하는가? (짧게, 직위만)
      unit: ""
      norm: text
