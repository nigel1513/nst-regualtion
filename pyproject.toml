[project]
name = "nst-regulation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pdfplumber>=0.11",
  "olefile>=0.47",
  "fastapi>=0.142.2",
  "uvicorn>=0.54.0",
  "psycopg-pool>=3.3.3",
  "neo4j>=5.20",
]

[project.scripts]
reg = "reg.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "testcontainers[postgres]>=4.8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live shared infrastructure"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# B008: FastAPI Depends/Query 기본값은 관용구. BLE001: 이벤트 단위 실패 격리는 의도된 광범위 예외 처리.
ignore = ["B008", "BLE001", "C408"]
