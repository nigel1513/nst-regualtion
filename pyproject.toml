[project]
name = "nst-regulation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "typer>=0.12",
  "pdfplumber>=0.11",
  "olefile>=0.47",
]

[project.scripts]
reg = "reg.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "testcontainers[postgres]>=4.8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live shared infrastructure"]
addopts = "-m 'not integration'"
